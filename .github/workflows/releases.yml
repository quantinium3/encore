name: encore-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: caching dependencies
        uses: Swatinem/rust-cache@v2

      - name: installing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev \
            libmpv-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: testing workspace
        run: cargo test --workspace --locked

      - name: build workspace
        run: cargo build --release --workspace --bins --locked

      - name: packaging
        run: |
          mkdir -p dist
          strip target/release/encore_app target/release/encore_login
          mv target/release/encore_app dist/
          mv target/release/encore_login dist/
          tar -C dist -czf encore-linux-x86_64.tar.gz .
          sha256sum encore-linux-x86_64.tar.gz > encore-linux-x86_64.tar.gz.sha256

      - name: github releases
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            encore-linux-x86_64.tar.gz
            encore-linux-x86_64.tar.gz.sha256
          generate_release_notes: true


