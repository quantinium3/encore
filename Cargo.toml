[workspace]
resolver = "3"
members = [
	"crates/encore_app",
	"crates/encore_auth",
	"crates/encore_core", "crates/encore_storage",
	"crates/encore_ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
gpui-kit = "0.7.3"
anyhow = "1"
thiserror = "2"
tempfile = "3"
futures = "0.3.34"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
encore_core = { path = "crates/encore_core" }
encore_ui = { path = "crates/encore_ui" }
encore_auth = { path = "crates/encore_auth" }
encore_storage = { path = "crates/encore_storage" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
